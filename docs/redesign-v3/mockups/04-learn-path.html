<body>


<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #f4f5f9; font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #12131a; display: flex; flex-direction: column">

    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <h2 style="margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -0.02em">Chặng 3</h2>
      <span style="font-size: 14px; color: #565b6e">2 từ mới, 4 từ ôn lại</span>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 6px">
      <span style="display: flex; align-items: center; gap: 6px; background: #eef0f6; border-radius: 999px; padding: 5px 10px 5px 12px; font-size: 15px"><span style="font-family: 'Noto Sans SC', sans-serif; font-weight: 700">饺子</span><span style="display: flex; gap: 2px" aria-label="đang học"><span style="width: 6px; height: 6px; border-radius: 50%; background: #3d63ff"></span><span style="width: 6px; height: 6px; border-radius: 50%; background: #3d63ff"></span><span style="width: 6px; height: 6px; border-radius: 50%; background: #cdd2df"></span></span></span>
