<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Đăng ký trên điện thoại</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;family=Noto+Sans+SC:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2443c7;text-decoration:none}a:hover{color:#2a47d6}
</style>

</head>
<body>


<div style="width: 390px; height: 844px; overflow: hidden; background: #3557f5; font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #12131a; display: flex; flex-direction: column">
  <section aria-label="Giới thiệu" style="position: relative; height: 250px; flex: none; color: #fff; overflow: hidden">
    <span aria-hidden="true" style="position: absolute; width: 260px; height: 260px; border-radius: 50%; background: #4a69ff; right: -90px; top: -90px"></span>
    <span aria-hidden="true" style="position: absolute; width: 140px; height: 140px; border-radius: 50%; background: #2f4fe6; left: -50px; bottom: 10px"></span>
    <div style="position: absolute; left: 20px; top: 18px; display: flex; align-items: center; gap: 8px">
      <span style="position: relative; width: 32px; height: 32px; border-radius: 10px; background: #fff; color: #3557f5; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px">S<span style="position: absolute; top: -3px; right: -3px; width: 10px; height: 10px; border-radius: 50%; background: #ffc23d; border: 2px solid #3557f5"></span></span>
      <span style="font-weight: 800; font-size: 19px; letter-spacing: -0.03em">Sổ Từ</span>
    </div>
    <div aria-hidden="true" style="position: absolute; left: 22px; top: 92px; transform: rotate(-7deg); background: #fff; color: #12131a; border-radius: 14px; padding: 8px 12px; box-shadow: 0 12px 24px -10px rgb(10 20 80 / .5)"><span style="display: block; font-weight: 800; font-size: 16px">hello</span><span style="font-size: 12px; font-weight: 600; color: #2443c7">xin chào</span></div>
    <div aria-hidden="true" style="position: absolute; right: 22px; top: 70px; transform: rotate(6deg); background: #fff; color: #12131a; border-radius: 14px; padding: 6px 12px; text-align: center; box-shadow: 0 12px 24px -10px rgb(10 20 80 / .5)"><span style="display: block; font-family: 'Noto Sans SC', sans-serif; font-weight: 700; font-size: 24px; line-height: 1.1">你好</span><span style="font-size: 12px; font-weight: 600"><span style="color: #c25e00">nǐ</span> <span style="color: #c25e00">hǎo</span></span></div>
    <div aria-hidden="true" style="position: absolute; right: 36px; top: 160px; transform: rotate(-4deg); background: #efe7ff; color: #5b2fcc; border-radius: 999px; padding: 5px 11px; font-weight: 800; font-size: 12px">+20 XP</div>
    <svg width="150" height="150" viewBox="0 0 120 120" fill="none" stroke="#2b2d3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 120px; bottom: 10px">
      <path d="M82 100C97 98 102 86 95 76"/>
      <path d="M40 84C32 96 33 111 47 113h26c14-2 15-17 7-29" fill="#fff"/>
      <path d="M42 81q18 9 36 0" stroke="#ff5c4d" stroke-width="6"/>
      <path d="M66 86l5 15 8-3-5-14z" fill="#ff5c4d" stroke-width="2"/>
      <path d="M36 28C22 25 13 41 17 60c6 7 17 1 21-15z" fill="#c98b5a" transform="rotate(-8 34 32)"/>
      <path d="M84 28c14-3 23 13 19 32-6 7-17 1-21-15z" fill="#c98b5a" transform="rotate(8 86 32)"/>
      <path d="M29 50C27 31 42 22 60 22c19 0 33 10 31 31-1 19-15 28-31 28-17 0-30-9-31-31z" fill="#fff"/>
      <ellipse cx="60" cy="66" rx="17" ry="12.5" fill="#f6e7d6" stroke="none"/>
      <circle cx="35" cy="63" r="5" fill="#ff8fbf" stroke="none"/>
      <circle cx="85" cy="63" r="5" fill="#ff8fbf" stroke="none"/>
      <circle cx="75" cy="50" r="5" fill="#2b2d3a" stroke="none"/>
      <circle cx="76.8" cy="48.2" r="1.6" fill="#fff" stroke="none"/>
      <path d="M54.5 59c0-2.5 11-2.5 11 0c0 3.5-4 5.5-5.5 5.5S54.5 62.5 54.5 59z" fill="#2b2d3a" stroke="none"/>
      <path d="M55 69q5 4 10 0"/>
      <path d="M46 86Q34 72 44 57" stroke="#2b2d3a" stroke-width="12"/>
      <path d="M46 86Q34 72 44 57" stroke="#fff" stroke-width="7"/>
      <ellipse cx="45" cy="50" rx="11" ry="9" fill="#fff"/>
      <path d="M40 44.5v3M45 43.5v3M50 44.5v3" stroke-width="1.8"/>
      <path d="M74 88Q90 84 86 74" stroke="#2b2d3a" stroke-width="12"/>
      <path d="M74 88Q90 84 86 74" stroke="#fff" stroke-width="7"/>
      <ellipse cx="86" cy="70" rx="9.5" ry="8" fill="#fff"/>
      <path d="M82 65v2.5M86 64v2.5M90 65v2.5" stroke-width="1.8"/>
    </svg>
  </section>

  <form aria-label="Tạo tài khoản" style="flex: 1; margin-top: -4px; background: #fff; border-radius: 28px 28px 0 0; padding: 22px 20px 20px; display: flex; flex-direction: column; gap: 14px">
    <nav aria-label="Chọn trang" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: #eef0f6; border-radius: 999px; padding: 4px">
      <a href="#" style="height: 40px; border-radius: 999px; color: #565b6e; font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center">Đăng nhập</a>
      <a href="#" aria-current="page" style="height: 40px; border-radius: 999px; background: #fff; box-shadow: 0 1px 3px rgb(16 24 40 / .12); color: #12131a; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center">Đăng ký</a>
    </nav>
    <h1 style="margin: 2px 0 0; font-size: 25px; font-weight: 800; letter-spacing: -0.03em">Tạo sổ từ miễn phí</h1>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Tên của bạn
      <span style="height: 50px; border-radius: 14px; background: #eef0f6; display: flex; align-items: center; gap: 10px; padding: 0 14px">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#565b6e" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>
        <input value="Minh Anh" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-weight: 500; font-size: 16px">
      </span>
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Email
      <span style="height: 50px; border-radius: 14px; background: #eef0f6; display: flex; align-items: center; gap: 10px; padding: 0 14px">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#565b6e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
        <input type="email" value="minhanh@gmail.com" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-weight: 500; font-size: 16px">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#08724f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
      </span>
    </label>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="pw2" style="font-size: 14px; font-weight: 600">Mật khẩu</label>
      <span style="height: 50px; border-radius: 14px; background: #fff; border: 2px solid #3557f5; box-shadow: 0 0 0 4px rgb(53 87 245 / .15); display: flex; align-items: center; gap: 10px; padding: 0 4px 0 12px">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#3557f5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input id="pw2" type="text" value="hocmoingay" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-weight: 500; font-size: 16px">
        <button type="button" aria-label="Ẩn mật khẩu" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; color: #3557f5; display: flex; align-items: center; justify-content: center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/></svg></button>
      </span>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; margin-top: 4px" aria-hidden="true">
        <span style="height: 6px; border-radius: 999px; background: #c25e00"></span><span style="height: 6px; border-radius: 999px; background: #c25e00"></span><span style="height: 6px; border-radius: 999px; background: #e4e7f0"></span><span style="height: 6px; border-radius: 999px; background: #e4e7f0"></span>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 600"><span style="color: #a84a00">Mật khẩu hơi yếu</span><span style="color: #565b6e">Thêm số để mạnh hơn</span></div>
      <ul style="margin: 2px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 13px">
        <li style="display: flex; align-items: center; gap: 6px; color: #08724f; font-weight: 600"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Ít nhất 8 ký tự</li>
        <li style="display: flex; align-items: center; gap: 6px; color: #565b6e"><span style="width: 13px; height: 13px; border-radius: 50%; border: 2px solid #cdd2df"></span>Có cả chữ và số</li>
      </ul>
    </div>
    <button type="submit" style="margin-top: auto; height: 56px; border: 0; border-radius: 16px; background: #3557f5; color: #fff; font: inherit; font-weight: 800; font-size: 17px; box-shadow: 0 4px 0 0 #1f36a8">Tạo tài khoản</button>
  </form>
</div>


</body>
</html>
