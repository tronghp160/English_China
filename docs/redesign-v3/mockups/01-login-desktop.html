<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Đăng nhập — Sổ Từ</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;family=Noto+Sans+SC:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2443c7;text-decoration:none}a:hover{color:#2a47d6}
</style>

</head>
<body>


<div style="width: 1280px; height: 800px; box-sizing: border-box; background: #f4f5f9; font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #12131a; display: grid; grid-template-columns: 1.1fr 1fr; padding: 16px; gap: 16px">

  <section aria-label="Giới thiệu Sổ Từ" style="position: relative; overflow: hidden; border-radius: 32px; background: #3557f5; color: #fff; padding: 36px 40px; display: flex; flex-direction: column">
    <span aria-hidden="true" style="position: absolute; width: 420px; height: 420px; border-radius: 50%; background: #4a69ff; right: -140px; top: -120px"></span>
    <span aria-hidden="true" style="position: absolute; width: 300px; height: 300px; border-radius: 50%; background: #2f4fe6; left: -120px; bottom: 120px"></span>
    <span aria-hidden="true" style="position: absolute; width: 90px; height: 90px; border-radius: 50%; background: #4a69ff; left: 300px; top: 140px"></span>

    <div style="position: relative; display: flex; align-items: center; gap: 10px">
      <span style="position: relative; width: 38px; height: 38px; border-radius: 12px; background: #fff; color: #3557f5; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 21px">S<span style="position: absolute; top: -3px; right: -3px; width: 11px; height: 11px; border-radius: 50%; background: #ffc23d; border: 2px solid #3557f5"></span></span>
      <span style="font-weight: 800; font-size: 22px; letter-spacing: -0.03em">Sổ Từ</span>
    </div>

    <div aria-hidden="true" style="position: absolute; left: 52px; top: 120px; transform: rotate(-6deg); background: #fff; color: #12131a; border-radius: 18px; padding: 12px 16px; box-shadow: 0 16px 30px -12px rgb(10 20 80 / .45); display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 22px; font-weight: 800; letter-spacing: -0.02em">resilient</span>
      <span style="font-size: 13px; color: #565b6e">/rɪˈzɪl.i.ənt/</span>
      <span style="font-size: 14px; font-weight: 600; color: #2443c7">kiên cường</span>
    </div>
    <div aria-hidden="true" style="position: absolute; right: 56px; top: 96px; transform: rotate(5deg); background: #fff; color: #12131a; border-radius: 18px; padding: 12px 18px; box-shadow: 0 16px 30px -12px rgb(10 20 80 / .45); display: flex; flex-direction: column; align-items: center; gap: 2px">
      <span style="font-family: 'Noto Sans SC', sans-serif; font-size: 34px; font-weight: 700; line-height: 1.1">坚强</span>
      <span style="font-size: 14px; font-weight: 600"><span style="color: #d92d20">jiān</span> <span style="color: #c25e00">qiáng</span></span>
    </div>
    <div aria-hidden="true" style="position: absolute; left: 70px; top: 330px; transform: rotate(4deg); background: #fff2cc; color: #855400; border-radius: 999px; padding: 8px 14px; font-weight: 800; font-size: 14px; box-shadow: 0 12px 24px -10px rgb(10 20 80 / .4); display: flex; align-items: center; gap: 6px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="#ffc23d" stroke="#855400" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>Chuỗi 14 ngày
    </div>
    <div aria-hidden="true" style="position: absolute; right: 70px; top: 300px; transform: rotate(-5deg); background: #fff; color: #12131a; border-radius: 18px; padding: 10px 16px; box-shadow: 0 16px 30px -12px rgb(10 20 80 / .45); display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 20px; font-weight: 800">thank you</span>
      <span style="font-size: 14px; font-weight: 600; color: #2443c7">cảm ơn</span>
    </div>
    <div aria-hidden="true" style="position: absolute; right: 150px; top: 420px; transform: rotate(8deg); background: #efe7ff; color: #5b2fcc; border-radius: 999px; padding: 7px 14px; font-weight: 800; font-size: 14px; box-shadow: 0 12px 24px -10px rgb(10 20 80 / .4)">+20 XP</div>

    <div style="position: relative; margin-top: auto; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 14px; max-width: 330px">
        <p style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.15">Mỗi ngày ôn đúng những từ sắp quên.</p>
        <div style="display: flex; gap: 6px" aria-hidden="true"><span style="width: 22px; height: 8px; border-radius: 999px; background: #fff"></span><span style="width: 8px; height: 8px; border-radius: 999px; background: rgb(255 255 255 / .45)"></span><span style="width: 8px; height: 8px; border-radius: 999px; background: rgb(255 255 255 / .45)"></span></div>
      </div>
      <div style="position: relative; width: 230px; height: 230px; flex: none; margin-right: -8px; margin-bottom: -10px">
        <span aria-hidden="true" style="position: absolute; left: 20px; right: 20px; bottom: 6px; height: 34px; border-radius: 50%; background: #2a47d6"></span>
        <svg width="230" height="230" viewBox="0 0 120 120" fill="none" stroke="#2b2d3a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; inset: 0">
          <path d="M82 100C97 98 102 86 95 76"/>
          <path d="M40 84C32 96 33 111 47 113h26c14-2 15-17 7-29" fill="#fff"/>
          <path d="M47 113c0-6 8-6 8 0M65 113c0-6 8-6 8 0"/>
          <path d="M42 81q18 9 36 0" stroke="#3557f5" stroke-width="5"/>
          <circle cx="60" cy="90" r="3.4" fill="#ffc23d" stroke-width="1.6"/>
          <path d="M36 28C22 25 13 41 17 60c6 7 17 1 21-15z" fill="#c98b5a" transform="rotate(-8 34 32)"/>
          <path d="M84 28c14-3 23 13 19 32-6 7-17 1-21-15z" fill="#c98b5a" transform="rotate(8 86 32)"/>
          <path d="M29 50C27 31 42 22 60 22c19 0 33 10 31 31-1 19-15 28-31 28-17 0-30-9-31-31z" fill="#fff"/>
          <ellipse cx="60" cy="66" rx="17" ry="12.5" fill="#f6e7d6" stroke="none"/>
          <circle cx="35" cy="63" r="5" fill="#ff8fbf" stroke="none"/>
          <circle cx="85" cy="63" r="5" fill="#ff8fbf" stroke="none"/>
          <path d="M54.5 59c0-2.5 11-2.5 11 0c0 3.5-4 5.5-5.5 5.5S54.5 62.5 54.5 59z" fill="#2b2d3a" stroke="none"/>
          <path d="M55 69q5 4 10 0"/>
          <path d="M46 86Q34 72 44 57" stroke="#2b2d3a" stroke-width="12"/>
          <path d="M46 86Q34 72 44 57" stroke="#fff" stroke-width="7"/>
          <path d="M74 86Q86 72 76 57" stroke="#2b2d3a" stroke-width="12"/>
          <path d="M74 86Q86 72 76 57" stroke="#fff" stroke-width="7"/>
          <ellipse cx="45" cy="50" rx="11" ry="9" fill="#fff"/>
          <path d="M40 44.5v3M45 43.5v3M50 44.5v3" stroke-width="1.8"/>
          <ellipse cx="75" cy="50" rx="11" ry="9" fill="#fff"/>
          <path d="M70 44.5v3M75 43.5v3M80 44.5v3" stroke-width="1.8"/>
        </svg>
      </div>
    </div>
  </section>

  <section style="display: flex; align-items: center; justify-content: center">
    <form aria-label="Đăng nhập" style="width: 100%; max-width: 440px; background: #fff; border-radius: 28px; padding: 36px; box-shadow: 0 20px 40px -12px rgb(16 24 40 / .14), 0 4px 8px -2px rgb(16 24 40 / .04); display: flex; flex-direction: column; gap: 20px">
      <nav aria-label="Chọn trang" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: #eef0f6; border-radius: 999px; padding: 4px">
        <a href="#" aria-current="page" style="height: 42px; border-radius: 999px; background: #fff; box-shadow: 0 1px 3px rgb(16 24 40 / .12); color: #12131a; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center">Đăng nhập</a>
        <a href="#" style="height: 42px; border-radius: 999px; color: #565b6e; font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center">Đăng ký</a>
      </nav>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.03em">Chào mừng trở lại!</h1>
        <p style="margin: 0; font-size: 16px; color: #565b6e">Bin nhớ bạn lắm đó.</p>
      </div>
      <label style="display: flex; flex-direction: column; gap: 8px; font-size: 15px; font-weight: 600">Email
        <span style="height: 52px; border-radius: 14px; background: #eef0f6; display: flex; align-items: center; gap: 10px; padding: 0 14px">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#565b6e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
          <input type="email" value="minh@gmail.com" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-weight: 500; font-size: 16px; color: #12131a">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#08724f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
        </span>
      </label>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; justify-content: space-between; align-items: baseline"><label for="pw" style="font-size: 15px; font-weight: 600">Mật khẩu</label><a href="#" style="font-size: 14px; font-weight: 600">Quên mật khẩu?</a></div>
        <span style="height: 52px; border-radius: 14px; background: #fff; border: 2px solid #3557f5; box-shadow: 0 0 0 4px rgb(53 87 245 / .15); display: flex; align-items: center; gap: 10px; padding: 0 6px 0 12px">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3557f5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input id="pw" type="password" value="hocmoingay1" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 16px; letter-spacing: 0.1em">
          <button type="button" aria-label="Hiện mật khẩu" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; color: #565b6e; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </span>
      </div>
      <button type="submit" style="height: 56px; border: 0; border-radius: 16px; background: #3557f5; color: #fff; font: inherit; font-weight: 800; font-size: 17px; box-shadow: 0 4px 0 0 #1f36a8; margin-top: 4px">Đăng nhập</button>
      <p style="margin: 0; text-align: center; font-size: 15px; color: #565b6e">Chưa có tài khoản? <a href="#" style="font-weight: 700">Tạo sổ miễn phí</a></p>
    </form>
  </section>
</div>


</body>
</html>
