<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Trả lời đúng có combo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;family=Noto+Sans+SC:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2443c7;text-decoration:none}a:hover{color:#2a47d6}
</style>

</head>
<body>


<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #f4f5f9; font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #12131a; box-sizing: border-box; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px">
  <div style="display: flex; align-items: center; gap: 8px">
    <button aria-label="Thoát" style="width: 44px; height: 44px; border: 0; border-radius: 999px; background: transparent; color: #565b6e; display: flex; align-items: center; justify-content: center; flex: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <div style="flex: 1; position: relative; height: 14px; border-radius: 999px; background: #e4e7f0">
      <div style="width: 58%; height: 14px; border-radius: 999px; background: #12b886"></div>
      <span aria-hidden="true" style="position: absolute; left: 25%; top: 3px; width: 8px; height: 8px; border-radius: 50%; background: #fff"></span>
      <span aria-hidden="true" style="position: absolute; left: 50%; top: 2px; width: 10px; height: 10px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px rgb(255 194 61 / .7)"></span>
      <span aria-hidden="true" style="position: absolute; left: 75%; top: 3px; width: 8px; height: 8px; border-radius: 50%; background: #cdd2df"></span>
      <svg width="30" height="30" viewBox="0 0 120 120" aria-hidden="true" style="position: absolute; left: calc(58% - 15px); top: -26px" fill="none" stroke="#2b2d3a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M36 28C22 25 13 41 17 60c6 7 17 1 21-15z" fill="#c98b5a"/><path d="M84 28c14-3 23 13 19 32-6 7-17 1-21-15z" fill="#c98b5a"/><path d="M29 50C27 31 42 22 60 22c19 0 33 10 31 31-1 19-15 28-31 28-17 0-30-9-31-31z" fill="#fff"/><path d="M40 52q6-7 12 0M68 52q6-7 12 0"/><path d="M52 66q8 9 16 0z" fill="#ff7a8a"/></svg>
    </div>
    <span style="display: flex; align-items: center; gap: 3px; background: #fff2cc; color: #855400; border-radius: 999px; padding: 4px 9px; font-weight: 800; font-size: 14px; flex: none"><svg width="15" height="15" viewBox="0 0 24 24" fill="#ffc23d" stroke="#855400" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>×5</span>
    <span style="display: flex; align-items: center; gap: 3px; background: #efe7ff; color: #5b2fcc; border-radius: 999px; padding: 4px 9px; font-weight: 800; font-size: 14px; flex: none"><svg width="14" height="14" viewBox="0 0 24 24" fill="#8e5cff" stroke="#5b2fcc" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 3 6.5 7 .9-5.1 4.8 1.3 7L12 17.8 5.8 21.2l1.3-7L2 9.4l7-.9z"/></svg>24</span>
  </div>

  <div role="status" style="align-self: center; display: flex; align-items: center; gap: 8px; background: #ffc23d; color: #4d3200; border-radius: 999px; padding: 8px 18px; font-weight: 800; font-size: 16px; box-shadow: 0 8px 18px -8px rgb(201 138 18 / .7); transform: rotate(-2deg)">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff" stroke="#4d3200" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>Combo ×5! Tuyệt vời
  </div>

  <section aria-label="Câu hỏi" style="background: #fff; border-radius: 28px; box-shadow: 0 6px 16px -4px rgb(16 24 40 / .08); padding: 18px 20px 20px; display: flex; flex-direction: column; align-items: center; gap: 6px">
    <span style="align-self: flex-start; background: #e6ecff; color: #2443c7; border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 700">Ôn lại</span>
    <span style="font-family: 'Noto Sans SC', sans-serif; font-size: 64px; font-weight: 700; line-height: 1.1">米饭</span>
    <span style="display: flex; gap: 18px; font-size: 20px; font-weight: 600"><span style="color: #13804f">mǐ</span><span style="color: #2f55d4">fàn</span></span>
    <span style="font-size: 16px; color: #565b6e; margin-top: 4px">Nghĩa của từ này là gì?</span>
  </section>

  <div role="group" aria-label="Các đáp án" style="display: flex; flex-direction: column; gap: 10px; position: relative">
    <button style="position: relative; height: 58px; border-radius: 16px; background: #ddf6ec; border: 2px solid #12b886; box-shadow: 0 3px 0 0 #12b886; font: inherit; font-size: 18px; font-weight: 700; color: #08724f; display: flex; align-items: center; gap: 12px; padding: 0 14px; text-align: left">
      <span style="width: 30px; height: 30px; border-radius: 9px; background: #12b886; color: #fff; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>cơm
      <span aria-hidden="true" style="position: absolute; right: 18px; top: -26px; background: #8e5cff; color: #fff; border-radius: 999px; padding: 3px 10px; font-size: 14px; font-weight: 800; box-shadow: 0 6px 14px -6px rgb(91 47 204 / .7)">+1 XP</span>
      <span aria-hidden="true" style="position: absolute; left: 6px; top: -8px; width: 8px; height: 8px; border-radius: 50%; background: #12b886"></span>
      <span aria-hidden="true" style="position: absolute; left: 34px; top: -12px; width: 6px; height: 6px; border-radius: 50%; background: #ffc23d"></span>
      <span aria-hidden="true" style="position: absolute; left: -6px; top: 20px; width: 6px; height: 6px; border-radius: 50%; background: #3d63ff"></span>
      <span aria-hidden="true" style="position: absolute; left: 50px; bottom: -10px; width: 7px; height: 7px; border-radius: 50%; background: #ff5fa8"></span>
    </button>
    <button style="height: 58px; border-radius: 16px; background: #fff; border: 2px solid #e3e6ef; box-shadow: 0 3px 0 0 #e3e6ef; font: inherit; font-size: 18px; font-weight: 600; color: #565b6e; display: flex; align-items: center; gap: 12px; padding: 0 14px; text-align: left; opacity: .7"><span style="width: 30px; height: 30px; border-radius: 9px; background: #eef0f6; color: #565b6e; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800">B</span>mì sợi</button>
    <button style="height: 58px; border-radius: 16px; background: #fff; border: 2px solid #e3e6ef; box-shadow: 0 3px 0 0 #e3e6ef; font: inherit; font-size: 18px; font-weight: 600; color: #565b6e; display: flex; align-items: center; gap: 12px; padding: 0 14px; text-align: left; opacity: .7"><span style="width: 30px; height: 30px; border-radius: 9px; background: #eef0f6; color: #565b6e; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800">C</span>trà</button>
  </div>

  <section aria-live="polite" style="position: absolute; left: 0; right: 0; bottom: 0; background: #ddf6ec; border-radius: 28px 28px 0 0; padding: 18px 18px 22px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 -10px 30px -12px rgb(16 24 40 / .2)">
    <div style="display: flex; align-items: center; gap: 12px">
      <svg width="76" height="76" viewBox="0 0 120 120" fill="none" stroke="#2b2d3a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-top: -30px; flex: none">
        <path d="M82 96C99 92 104 78 94 68"/>
        <path d="M40 80C32 92 33 104 47 106h26c14-2 15-14 7-26" fill="#fff"/>
        <path d="M44 106l-6 8M76 106l6 8"/>
        <path d="M42 77q18 9 36 0" stroke="#3557f5" stroke-width="5.5"/>
        <path d="M36 24C22 21 13 37 17 56c6 7 17 1 21-15z" fill="#c98b5a" transform="rotate(-14 34 28)"/>
        <path d="M84 24c14-3 23 13 19 32-6 7-17 1-21-15z" fill="#c98b5a" transform="rotate(14 86 28)"/>
        <path d="M29 46C27 27 42 18 60 18c19 0 33 10 31 31-1 19-15 28-31 28-17 0-30-9-31-31z" fill="#fff"/>
        <ellipse cx="60" cy="62" rx="17" ry="12.5" fill="#f6e7d6" stroke="none"/>
        <circle cx="37" cy="58" r="4" fill="#ff8fbf" stroke="none"/><circle cx="83" cy="58" r="4" fill="#ff8fbf" stroke="none"/>
        <path d="M40 47q6-7 12 0M68 47q6-7 12 0"/>
        <path d="M54.5 54c0-2.5 11-2.5 11 0c0 3.5-4 5.5-5.5 5.5S54.5 57.5 54.5 54z" fill="#2b2d3a" stroke="none"/>
        <path d="M51 63q9 11 18 0z" fill="#ff7a8a"/>
        <path d="M14 30l-6-4M12 42H5M106 30l6-4M108 42h7" stroke="#12b886" stroke-width="3"/>
      </svg>
      <div style="display: flex; flex-direction: column">
        <span style="font-size: 22px; font-weight: 800; color: #08724f; letter-spacing: -0.02em">Đúng rồi!</span>
        <span style="font-size: 15px; font-weight: 600; color: #08724f">Nhớ dai ghê! 米饭 là cơm.</span>
      </div>
    </div>
    <button style="height: 56px; border: 0; border-radius: 16px; background: #08845a; color: #fff; font: inherit; font-weight: 800; font-size: 17px; box-shadow: 0 4px 0 0 #055c3e">Tiếp tục</button>
  </section>
</div>


</body>
</html>
