<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Góc của Bin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2443c7;text-decoration:none}a:hover{color:#2a47d6}
</style>

</head>
<body>


<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #6b7286; font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #12131a">
  <section role="dialog" aria-label="Góc của Bin" style="position: absolute; left: 0; right: 0; bottom: 0; top: 150px; background: #fff; border-radius: 28px 28px 0 0; padding: 10px 18px 20px; display: flex; flex-direction: column; gap: 12px">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 999px; background: #e4e7f0"></span>
    <div style="display: flex; align-items: center; gap: 10px">
      <h1 style="flex: 1; margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.03em">Góc của Bin</h1>
      <span style="display: flex; align-items: center; gap: 5px; background: #fff2cc; color: #855400; border-radius: 999px; padding: 5px 11px; font-size: 14px; font-weight: 800"><svg width="18" height="12" viewBox="0 0 30 20" fill="#fff" stroke="#855400" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M6 4a3.5 3.5 0 0 1 5 3h8a3.5 3.5 0 1 1 5 3 3.5 3.5 0 1 1-5 3h-8a3.5 3.5 0 1 1-5-3 3.5 3.5 0 0 1 0-6z"/></svg>7 xương</span>
      <button aria-label="Đóng" style="width: 44px; height: 44px; border: 0; border-radius: 999px; background: #eef0f6; color: #565b6e; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="background: #efe7ff; color: #5b2fcc; border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 800">Cấp 4</span>
      <div style="flex: 1; height: 8px; border-radius: 999px; background: #e4e7f0"><div style="width: 80%; height: 8px; border-radius: 999px; background: #8e5cff"></div></div>
      <span style="font-size: 13px; color: #565b6e; font-variant-numeric: tabular-nums">120/150 XP</span>
    </div>

    <div style="position: relative; height: 270px; border-radius: 24px; overflow: hidden; background: #e6ecff">
      <div aria-hidden="true" style="position: absolute; left: 22px; top: 22px; width: 92px; height: 80px; border-radius: 14px; background: #bfe9f5; border: 5px solid #fff; box-shadow: 0 2px 6px rgb(16 24 40 / .08)">
        <span style="position: absolute; left: 50%; top: 0; bottom: 0; width: 5px; background: #fff; transform: translateX(-50%)"></span>
        <span style="position: absolute; left: 12px; top: 14px; width: 22px; height: 22px; border-radius: 50%; background: #ffc23d"></span>
        <span style="position: absolute; right: 8px; bottom: 14px; width: 30px; height: 12px; border-radius: 999px; background: #fff"></span>
      </div>
      <div aria-hidden="true" style="position: absolute; right: 24px; top: 30px; width: 70px; height: 50px; border-radius: 10px; background: #fff; border: 4px solid #c98b5a; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; color: #c98b5a">BIN</div>
      <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 92px; background: #f6e7d6"></div>
      <div aria-hidden="true" style="position: absolute; left: 70px; right: 70px; bottom: 22px; height: 46px; border-radius: 50%; background: #c7d4ff"></div>
      <div aria-hidden="true" style="position: absolute; right: 26px; bottom: 26px; width: 54px; height: 22px; border-radius: 0 0 22px 22px; background: #ff5c4d; border-top: 6px solid #c7311f"></div>
      <svg width="170" height="170" viewBox="0 0 120 120" fill="none" stroke="#2b2d3a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 110px; bottom: 26px">
        <path d="M82 100C97 98 102 86 95 76"/>
        <path d="M40 84C32 96 33 111 47 113h26c14-2 15-17 7-29" fill="#fff"/>
        <path d="M47 113c0-6 8-6 8 0M65 113c0-6 8-6 8 0"/>
        <path d="M42 81q18 9 36 0" stroke="#3557f5" stroke-width="5"/>
        <circle cx="60" cy="90" r="3.4" fill="#ffc23d" stroke-width="1.6"/>
        <path d="M36 28C22 25 13 41 17 60c6 7 17 1 21-15z" fill="#c98b5a"/>
        <path d="M84 28c14-3 23 13 19 32-6 7-17 1-21-15z" fill="#c98b5a"/>
        <path d="M29 50C27 31 42 22 60 22c19 0 33 10 31 31-1 19-15 28-31 28-17 0-30-9-31-31z" fill="#fff"/>
        <ellipse cx="60" cy="66" rx="17" ry="12.5" fill="#f6e7d6" stroke="none"/>
        <circle cx="38" cy="63" r="3.6" fill="#ff8fbf" stroke="none"/><circle cx="82" cy="63" r="3.6" fill="#ff8fbf" stroke="none"/>
        <rect x="34" y="42" width="22" height="15" rx="7" fill="#2b2d3a"/>
        <rect x="64" y="42" width="22" height="15" rx="7" fill="#2b2d3a"/>
        <path d="M56 47h8"/>
        <path d="M38 46l5-2" stroke="#fff" stroke-width="2"/><path d="M68 46l5-2" stroke="#fff" stroke-width="2"/>
        <path d="M54.5 59c0-2.5 11-2.5 11 0c0 3.5-4 5.5-5.5 5.5S54.5 62.5 54.5 59z" fill="#2b2d3a" stroke="none"/>
        <path d="M52 68q8 7 16 0"/>
      </svg>
      <svg width="54" height="34" viewBox="0 0 30 20" fill="#fff" stroke="#855400" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 34px; bottom: 112px; transform: rotate(-18deg)"><path d="M6 4a3.5 3.5 0 0 1 5 3h8a3.5 3.5 0 1 1 5 3 3.5 3.5 0 1 1-5 3h-8a3.5 3.5 0 1 1-5-3 3.5 3.5 0 0 1 0-6z"/></svg>
      <svg width="62" height="34" viewBox="0 0 110 60" fill="none" stroke="#3557f5" stroke-width="5" stroke-linecap="round" stroke-dasharray="6 12" aria-hidden="true" style="position: absolute; left: 82px; bottom: 112px"><path d="M8 40 Q 50 0 100 30"/><path d="M92 22l9 8-11 3" stroke-dasharray="none"/></svg>
      <span style="position: absolute; left: 14px; top: 172px; background: #fff; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700; color: #2443c7; box-shadow: 0 2px 6px rgb(16 24 40 / .1)">Kéo xương cho Bin</span>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-size: 15px; font-weight: 700">Tâm trạng: Vui vẻ</span>
      <span style="display: flex; gap: 4px" aria-label="4 trên 5">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#ff5fa8" stroke="#b3246a" stroke-width="1.6" aria-hidden="true"><path d="M12 21s-8-5.3-8-11a5 5 0 0 1 8-4 5 5 0 0 1 8 4c0 5.7-8 11-8 11z"/></svg>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#ff5fa8" stroke="#b3246a" stroke-width="1.6" aria-hidden="true"><path d="M12 21s-8-5.3-8-11a5 5 0 0 1 8-4 5 5 0 0 1 8 4c0 5.7-8 11-8 11z"/></svg>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#ff5fa8" stroke="#b3246a" stroke-width="1.6" aria-hidden="true"><path d="M12 21s-8-5.3-8-11a5 5 0 0 1 8-4 5 5 0 0 1 8 4c0 5.7-8 11-8 11z"/></svg>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#ff5fa8" stroke="#b3246a" stroke-width="1.6" aria-hidden="true"><path d="M12 21s-8-5.3-8-11a5 5 0 0 1 8-4 5 5 0 0 1 8 4c0 5.7-8 11-8 11z"/></svg>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#eef0f6" stroke="#cdd2df" stroke-width="1.6" aria-hidden="true"><path d="M12 21s-8-5.3-8-11a5 5 0 0 1 8-4 5 5 0 0 1 8 4c0 5.7-8 11-8 11z"/></svg>
      </span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
      <button style="height: 76px; border: 0; border-radius: 18px; background: #fff2cc; color: #855400; font: inherit; font-size: 13px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px"><svg width="26" height="18" viewBox="0 0 30 20" fill="#fff" stroke="#855400" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 4a3.5 3.5 0 0 1 5 3h8a3.5 3.5 0 1 1 5 3 3.5 3.5 0 1 1-5 3h-8a3.5 3.5 0 1 1-5-3 3.5 3.5 0 0 1 0-6z"/></svg>Cho ăn</button>
      <button style="height: 76px; border: 0; border-radius: 18px; background: #ddf6ec; color: #08724f; font: inherit; font-size: 13px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px"><svg width="24" height="24" viewBox="0 0 24 24" fill="#12b886" stroke="#08724f" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M5 7c4 2 10 2 14 0M5 17c4-2 10-2 14 0" fill="none" stroke="#fff"/></svg>Ném bóng</button>
      <button style="height: 76px; border: 0; border-radius: 18px; background: #e6ecff; color: #2443c7; font: inherit; font-size: 13px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z"/></svg>Làm trò</button>
      <button style="height: 76px; border: 0; border-radius: 18px; background: #ffe5f1; color: #b3246a; font: inherit; font-size: 13px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3 4 6l2 4 2-1v12h8V9l2 1 2-4-4-3a4 4 0 0 1-8 0z"/></svg>Trang phục</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 14px; font-weight: 700; color: #565b6e">Trang phục</span>
      <div style="display: flex; gap: 8px">
        <button aria-label="Kính râm, đang mặc" style="width: 64px; height: 64px; border-radius: 16px; background: #e6ecff; border: 2px solid #3557f5; display: flex; align-items: center; justify-content: center"><svg width="36" height="18" viewBox="0 0 36 18" aria-hidden="true"><rect x="1" y="2" width="14" height="11" rx="5" fill="#2b2d3a"/><rect x="21" y="2" width="14" height="11" rx="5" fill="#2b2d3a"/><path d="M15 6h6" stroke="#2b2d3a" stroke-width="2"/></svg></button>
        <button aria-label="Khăn quàng" style="width: 64px; height: 64px; border-radius: 16px; background: #fff; border: 2px solid #e3e6ef; display: flex; align-items: center; justify-content: center"><svg width="34" height="26" viewBox="0 0 34 26" aria-hidden="true"><path d="M2 4q15 8 30 0l1 6q-16 9-32 0z" fill="#ff5c4d" stroke="#2b2d3a" stroke-width="1.6"/><path d="M20 10l3 14 6-2-3-12z" fill="#ff5c4d" stroke="#2b2d3a" stroke-width="1.6"/></svg></button>
        <button aria-label="Nơ hồng" style="width: 64px; height: 64px; border-radius: 16px; background: #fff; border: 2px solid #e3e6ef; display: flex; align-items: center; justify-content: center"><svg width="34" height="22" viewBox="0 0 34 22" aria-hidden="true"><path d="M17 11 3 3v16zM17 11l14-8v16z" fill="#ff5fa8" stroke="#2b2d3a" stroke-width="1.6" stroke-linejoin="round"/><circle cx="17" cy="11" r="4" fill="#ff5fa8" stroke="#2b2d3a" stroke-width="1.6"/></svg></button>
        <button aria-label="Mũ lưỡi trai, mở ở cấp 5" style="position: relative; width: 64px; height: 64px; border-radius: 16px; background: #eef0f6; border: 2px solid #eef0f6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #565b6e"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span style="font-size: 11px; font-weight: 700">Cấp 5</span></button>
        <button aria-label="Vương miện, mở khi chuỗi 30 ngày" style="position: relative; width: 64px; height: 64px; border-radius: 16px; background: #eef0f6; border: 2px solid #eef0f6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #565b6e"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span style="font-size: 11px; font-weight: 700">30 ngày</span></button>
      </div>
    </div>
  </section>
</div>


</body>
</html>
