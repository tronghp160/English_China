<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Ghép thẻ đang chơi</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;family=Noto+Sans+SC:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2443c7;text-decoration:none}a:hover{color:#2a47d6}
</style>

</head>
<body>


<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #f4f5f9; font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #12131a; box-sizing: border-box; padding: 14px 16px 20px; display: flex; flex-direction: column; gap: 14px">
  <div style="display: flex; align-items: center; gap: 8px">
    <button aria-label="Thoát" style="width: 44px; height: 44px; border: 0; border-radius: 999px; background: transparent; color: #565b6e; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <span style="flex: 1; font-size: 16px; font-weight: 700">Ghép thẻ</span>
    <span style="display: flex; align-items: center; gap: 5px; background: #fff2cc; color: #855400; border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 800"><svg width="15" height="15" viewBox="0 0 24 24" fill="#ffc23d" stroke="#855400" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/></svg>Kỷ lục 18,4s</span>
  </div>

  <div style="position: relative; align-self: center; display: flex; flex-direction: column; align-items: center">
    <span style="font-size: 52px; font-weight: 800; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; line-height: 1">12,4<span style="font-size: 24px; color: #565b6e">s</span></span>
    <span aria-hidden="true" style="position: absolute; right: -46px; top: -6px; color: #b4232a; font-weight: 800; font-size: 18px; transform: rotate(8deg)">+1s</span>
    <div style="display: flex; gap: 8px; margin-top: 8px">
      <span style="background: #ddf6ec; color: #08724f; border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 800">Ghép đúng ×3</span>
      <span style="background: #ffe5e5; color: #b4232a; border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 700">1 lần ghép sai</span>
    </div>
  </div>

  <div role="group" aria-label="Các thẻ" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
    <span aria-hidden="true" style="height: 92px; border-radius: 18px; border: 2px dashed #cdd2df"></span>
    <button style="height: 92px; border-radius: 18px; background: #fff; border: 2px solid #e3e6ef; box-shadow: 0 3px 0 0 #e3e6ef; font: inherit; font-size: 17px; font-weight: 700; color: #12131a">cà phê</button>
    <button style="height: 92px; border-radius: 18px; background: #e6ecff; border: 2px solid #3557f5; box-shadow: 0 6px 0 0 #3557f5; transform: translateY(-4px); font-family: 'Noto Sans SC', sans-serif; font-size: 30px; font-weight: 700; color: #2443c7">茶</button>

    <button style="height: 92px; border-radius: 18px; background: #ffe5e5; border: 2px solid #e5484d; box-shadow: 0 3px 0 0 #e5484d; font-family: 'Noto Sans SC', sans-serif; font-size: 30px; font-weight: 700; color: #b4232a; transform: translateX(-3px)">饺子</button>
    <button style="height: 92px; border-radius: 18px; background: #fff; border: 2px solid #e3e6ef; box-shadow: 0 3px 0 0 #e3e6ef; font-family: 'Noto Sans SC', sans-serif; font-size: 30px; font-weight: 700; color: #12131a">咖啡</button>
    <button style="height: 92px; border-radius: 18px; background: #ffe5e5; border: 2px solid #e5484d; box-shadow: 0 3px 0 0 #e5484d; font: inherit; font-size: 17px; font-weight: 700; color: #b4232a; transform: translateX(3px)">mì sợi</button>

    <button style="position: relative; height: 92px; border-radius: 18px; background: #ddf6ec; border: 2px solid #12b886; box-shadow: 0 3px 0 0 #12b886; font-family: 'Noto Sans SC', sans-serif; font-size: 30px; font-weight: 700; color: #08724f; transform: scale(.94)">米饭<span aria-hidden="true" style="position: absolute; right: -4px; top: -6px; width: 8px; height: 8px; border-radius: 50%; background: #ffc23d"></span><span aria-hidden="true" style="position: absolute; left: 6px; top: -8px; width: 6px; height: 6px; border-radius: 50%; background: #12b886"></span></button>
    <span aria-hidden="true" style="height: 92px; border-radius: 18px; border: 2px dashed #cdd2df"></span>
    <button style="position: relative; height: 92px; border-radius: 18px; background: #ddf6ec; border: 2px solid #12b886; box-shadow: 0 3px 0 0 #12b886; font: inherit; font-size: 17px; font-weight: 700; color: #08724f; transform: scale(.94)">cơm<span aria-hidden="true" style="position: absolute; left: -4px; bottom: -6px; width: 8px; height: 8px; border-radius: 50%; background: #3d63ff"></span><span aria-hidden="true" style="position: absolute; right: 10px; top: -8px; width: 6px; height: 6px; border-radius: 50%; background: #ff5fa8"></span></button>

    <button style="height: 92px; border-radius: 18px; background: #fff; border: 2px solid #e3e6ef; box-shadow: 0 3px 0 0 #e3e6ef; font: inherit; font-size: 17px; font-weight: 700; color: #12131a">trà</button>
    <button style="height: 92px; border-radius: 18px; background: #fff; border: 2px solid #e3e6ef; box-shadow: 0 3px 0 0 #e3e6ef; font: inherit; font-size: 17px; font-weight: 700; color: #12131a">sủi cảo</button>
    <button style="height: 92px; border-radius: 18px; background: #fff; border: 2px solid #e3e6ef; box-shadow: 0 3px 0 0 #e3e6ef; font-family: 'Noto Sans SC', sans-serif; font-size: 30px; font-weight: 700; color: #12131a">面条</button>
  </div>

  <div style="margin-top: auto; display: flex; align-items: flex-end; gap: 10px">
    <svg width="72" height="72" viewBox="0 0 120 120" fill="none" stroke="#2b2d3a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M82 100C97 98 102 86 95 76"/>
      <path d="M40 84C32 96 33 111 47 113h26c14-2 15-17 7-29" fill="#fff"/>
      <path d="M42 81q18 9 36 0" stroke="#3557f5" stroke-width="5"/>
      <circle cx="88" cy="88" r="13" fill="#ffc23d"/><path d="M88 80v8l5 3M85 72h6"/>
      <path d="M36 28C22 25 13 41 17 60c6 7 17 1 21-15z" fill="#c98b5a" transform="rotate(-10 34 32)"/>
      <path d="M84 28c14-3 23 13 19 32-6 7-17 1-21-15z" fill="#c98b5a" transform="rotate(10 86 32)"/>
      <path d="M29 50C27 31 42 22 60 22c19 0 33 10 31 31-1 19-15 28-31 28-17 0-30-9-31-31z" fill="#fff"/>
      <ellipse cx="60" cy="66" rx="17" ry="12.5" fill="#f6e7d6" stroke="none"/>
      <circle cx="46" cy="50" r="5.4" fill="#2b2d3a" stroke="none"/><circle cx="48" cy="48" r="1.8" fill="#fff" stroke="none"/>
      <circle cx="74" cy="50" r="5.4" fill="#2b2d3a" stroke="none"/><circle cx="76" cy="48" r="1.8" fill="#fff" stroke="none"/>
      <path d="M54.5 58c0-2.5 11-2.5 11 0c0 3.5-4 5.5-5.5 5.5S54.5 61.5 54.5 58z" fill="#2b2d3a" stroke="none"/>
      <ellipse cx="60" cy="70" rx="4" ry="4.5" fill="#ff7a8a"/>
    </svg>
    <span style="background: #fff; border-radius: 16px 16px 16px 4px; padding: 10px 14px; font-size: 15px; font-weight: 600; box-shadow: 0 1px 3px rgb(16 24 40 / .08); margin-bottom: 20px">Nhanh lên, sắp phá kỷ lục rồi!</span>
  </div>
</div>


</body>
</html>
