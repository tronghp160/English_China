<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Chọn chế độ luyện tập</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2443c7;text-decoration:none}a:hover{color:#2a47d6}
</style>

</head>
<body>


<div style="width: 390px; height: 1000px; background: #f4f5f9; font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #12131a; box-sizing: border-box; padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 16px">
  <div style="display: flex; flex-direction: column; gap: 2px">
    <h1 style="margin: 0; font-size: 27px; font-weight: 800; letter-spacing: -0.03em">Luyện tập</h1>
    <span style="font-size: 14px; color: #565b6e">Luyện thêm ngoài giờ ôn</span>
  </div>

  <h2 style="margin: 4px 0 0; font-size: 15px; font-weight: 700; color: #565b6e">Học bộ từ</h2>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <button style="position: relative; text-align: left; font: inherit; color: #12131a; background: #e6ecff; border: 2px solid #3d63ff; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 8px">
      <span style="width: 44px; height: 44px; border-radius: 14px; background: #3d63ff; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg></span>
      <span style="font-weight: 700; font-size: 16px">Học</span>
      <span style="font-size: 13px; color: #2443c7; line-height: 1.35">Học theo vòng tới khi thuộc hết</span>
      <span style="position: absolute; top: 12px; right: 12px; width: 24px; height: 24px; border-radius: 50%; background: #3d63ff; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>
    </button>
    <button style="text-align: left; font: inherit; color: #12131a; background: #fff; border: 2px solid transparent; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 1px 3px rgb(16 24 40 / .06)">
      <span style="width: 44px; height: 44px; border-radius: 14px; background: #8e5cff; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></svg></span>
      <span style="font-weight: 700; font-size: 16px">Kiểm tra</span>
      <span style="font-size: 13px; color: #565b6e; line-height: 1.35">Bài trộn nhiều dạng câu</span>
    </button>
    <button style="text-align: left; font: inherit; color: #12131a; background: #fff; border: 2px solid transparent; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 1px 3px rgb(16 24 40 / .06)">
      <span style="width: 44px; height: 44px; border-radius: 14px; background: #ff8a2b; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/><path d="M11 7h4a2 2 0 0 1 2 2v4"/></svg></span>
      <span style="font-weight: 700; font-size: 16px">Ghép thẻ</span>
      <span style="font-size: 13px; color: #565b6e; line-height: 1.35">Ghép từ với nghĩa thật nhanh</span>
    </button>
    <button style="text-align: left; font: inherit; color: #12131a; background: #fff; border: 2px solid transparent; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 1px 3px rgb(16 24 40 / .06)">
      <span style="width: 44px; height: 44px; border-radius: 14px; background: #14b8c4; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 10 5-10 5L2 7z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg></span>
      <span style="font-weight: 700; font-size: 16px">Lật thẻ</span>
      <span style="font-size: 13px; color: #565b6e; line-height: 1.35">Lật qua lại, tự đánh dấu</span>
    </button>
  </div>

  <h2 style="margin: 4px 0 0; font-size: 15px; font-weight: 700; color: #565b6e">Luyện riêng từng kỹ năng</h2>
  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
    <button style="font: inherit; color: #12131a; background: #fff; border: 0; border-radius: 18px; padding: 12px 4px; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; box-shadow: 0 1px 3px rgb(16 24 40 / .06)"><span style="width: 40px; height: 40px; border-radius: 12px; background: #ddf6ec; color: #08724f; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 7 2 2 4-4"/><path d="m3 17 2 2 4-4"/><path d="M13 6h8M13 12h8M13 18h8"/></svg></span>Trắc nghiệm</button>
    <button style="font: inherit; color: #12131a; background: #fff; border: 0; border-radius: 18px; padding: 12px 4px; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; box-shadow: 0 1px 3px rgb(16 24 40 / .06)"><span style="width: 40px; height: 40px; border-radius: 12px; background: #ffe5f1; color: #b3246a; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M7 15h10"/></svg></span>Gõ từ</button>
    <button style="font: inherit; color: #12131a; background: #fff; border: 0; border-radius: 18px; padding: 12px 4px; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; box-shadow: 0 1px 3px rgb(16 24 40 / .06)"><span style="width: 40px; height: 40px; border-radius: 12px; background: #fff2cc; color: #855400; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/></svg></span>Nghe</button>
    <button style="font: inherit; color: #12131a; background: #fff; border: 0; border-radius: 18px; padding: 12px 4px; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; box-shadow: 0 1px 3px rgb(16 24 40 / .06)"><span style="width: 40px; height: 40px; border-radius: 12px; background: #ffe7e3; color: #c7311f; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="8" rx="2"/><path d="M12 6v12"/></svg></span>Điền từ</button>
  </div>

  <section style="background: #fff; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 1px 3px rgb(16 24 40 / .06)">
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Bộ từ
      <span style="height: 48px; border-radius: 14px; background: #eef0f6; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; font-weight: 500; font-size: 15px">Mọi bộ tiếng Anh<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#565b6e" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span>
    </label>
    <div style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Số từ
      <div style="display: flex; background: #eef0f6; border-radius: 999px; padding: 4px">
        <span style="flex: 1; text-align: center; height: 36px; line-height: 36px; border-radius: 999px; background: #fff; box-shadow: 0 1px 3px rgb(16 24 40 / .1); font-weight: 700">10 từ</span>
        <span style="flex: 1; text-align: center; height: 36px; line-height: 36px; color: #565b6e; font-weight: 500">20 từ</span>
        <span style="flex: 1; text-align: center; height: 36px; line-height: 36px; color: #565b6e; font-weight: 500">50 từ</span>
      </div>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <span style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">Tính vào ôn tập</span><span style="font-size: 13px; color: #565b6e">Kết quả sẽ đổi lịch ôn của từ</span></span>
      <span style="flex: none; width: 48px; height: 28px; border-radius: 999px; background: #3557f5; position: relative"><span style="position: absolute; right: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / .2)"></span></span>
    </div>
  </section>

  <a href="#" style="margin-top: auto; height: 56px; border-radius: 18px; background: #3557f5; color: #fff; font-weight: 800; font-size: 17px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 0 #1f36a8">Bắt đầu luyện</a>
</div>


</body>
</html>
