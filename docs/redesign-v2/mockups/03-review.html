<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Ôn thẻ</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;family=Noto+Sans+SC:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2443c7;text-decoration:none}a:hover{color:#2a47d6}
</style>

</head>
<body>


<div style="width: 390px; height: 844px; background: #f4f5f9; font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #12131a; box-sizing: border-box; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 18px">
  <div style="display: flex; align-items: center; gap: 12px">
    <button aria-label="Thoát phiên ôn" style="width: 44px; height: 44px; border: 0; border-radius: 999px; background: transparent; color: #565b6e; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <div style="flex: 1; position: relative; height: 12px; border-radius: 999px; background: #e4e7f0">
      <div style="width: 36%; height: 12px; border-radius: 999px; background: #3557f5"></div>
      <svg width="30" height="30" viewBox="0 0 64 64" aria-hidden="true" style="position: absolute; left: calc(36% - 15px); top: -22px"><ellipse cx="14" cy="27" rx="8" ry="13" fill="#c98b5a" stroke="#2b2d3a" stroke-width="3" transform="rotate(18 14 27)"/><ellipse cx="50" cy="27" rx="8" ry="13" fill="#c98b5a" stroke="#2b2d3a" stroke-width="3" transform="rotate(-18 50 27)"/><ellipse cx="32" cy="32" rx="19" ry="17" fill="#fff" stroke="#2b2d3a" stroke-width="3"/><ellipse cx="32" cy="39" rx="9" ry="6.5" fill="#f6e7d6"/><circle cx="25" cy="30" r="2.8" fill="#2b2d3a"/><circle cx="39" cy="30" r="2.8" fill="#2b2d3a"/><ellipse cx="32" cy="36" rx="3" ry="2.2" fill="#2b2d3a"/></svg>
    </div>
    <span style="font-weight: 700; font-size: 15px; color: #565b6e; font-variant-numeric: tabular-nums">12/33</span>
  </div>

  <section aria-label="Thẻ từ" style="flex: 1; background: #fff; border-radius: 28px; box-shadow: 0 20px 40px -12px rgb(16 24 40 / .18), 0 4px 8px -2px rgb(16 24 40 / .05); overflow: hidden; display: flex; flex-direction: column">
    <div style="height: 6px; background: #ff5c4d"></div>
    <div style="padding: 22px 24px 24px; display: flex; flex-direction: column; align-items: center; gap: 14px; flex: 1">
      <div style="align-self: stretch; display: flex; justify-content: space-between; align-items: center">
        <span style="background: #ffe7e3; color: #c7311f; border-radius: 8px; padding: 2px 8px; font-size: 13px; font-weight: 800; font-family: 'Noto Sans SC', sans-serif">中</span>
        <span style="background: #efe7ff; color: #5b2fcc; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 700">Danh từ</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; margin-top: 6px">
        <span style="font-family: 'Noto Sans SC', sans-serif; font-size: 76px; font-weight: 700; line-height: 1.1; letter-spacing: 0.04em">爸爸</span>
        <span style="display: flex; gap: 22px; font-size: 22px; font-weight: 600"><span style="color: #2f55d4">bà</span><span style="color: #565b6e">ba</span></span>
      </div>
      <button aria-label="Nghe phát âm" style="width: 48px; height: 48px; border: 0; border-radius: 999px; background: #eef0f6; color: #2443c7; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg></button>
      <div style="align-self: stretch; height: 1px; background: #e3e6ef; margin: 4px 0"></div>
      <span style="font-size: 28px; font-weight: 800; letter-spacing: -0.02em">bố, ba</span>
      <div style="align-self: stretch; background: #eef0f6; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px">
        <span style="font-family: 'Noto Sans SC', sans-serif; font-size: 18px; font-weight: 500">我<b style="color: #3557f5">爸爸</b>是老师。</span>
        <span style="font-size: 14px; color: #565b6e">Bố tôi là giáo viên.</span>
      </div>
    </div>
  </section>

  <div role="group" aria-label="Bạn nhớ từ này thế nào?" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
    <button style="height: 64px; border: 0; border-radius: 16px; background: #e5484d; color: #fff; font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; box-shadow: 0 4px 0 0 #b4232a"><span style="font-weight: 800; font-size: 16px">Quên</span><span style="font-size: 12px; opacity: .9">1 phút</span></button>
    <button style="height: 64px; border: 0; border-radius: 16px; background: #c25e00; color: #fff; font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; box-shadow: 0 4px 0 0 #8a4300"><span style="font-weight: 800; font-size: 16px">Khó</span><span style="font-size: 12px; opacity: .9">1 ngày</span></button>
    <button style="height: 64px; border: 0; border-radius: 16px; background: #3557f5; color: #fff; font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; box-shadow: 0 4px 0 0 #1f36a8"><span style="font-weight: 800; font-size: 16px">Nhớ</span><span style="font-size: 12px; opacity: .9">3 ngày</span></button>
    <button style="height: 64px; border: 0; border-radius: 16px; background: #08845a; color: #fff; font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; box-shadow: 0 4px 0 0 #055c3e"><span style="font-weight: 800; font-size: 16px">Dễ</span><span style="font-size: 12px; opacity: .9">8 ngày</span></button>
  </div>
</div>


</body>
</html>
